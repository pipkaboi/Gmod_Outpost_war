outpost_war.player_help=Выберите команду и вступите в неё. Свободные NPC вашей команды (не охрана и не лидеры отрядов) рядом с вами вступят в ваш отряд и будут следовать за вами. Точки вы захватываете так же, как NPC: стоя в зоне.
