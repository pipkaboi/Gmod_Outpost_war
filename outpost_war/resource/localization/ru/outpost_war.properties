outpost_war.tool_help=Аванпост спавнит NPC волнами. Сначала заполняется гарнизон (охрана), остальные собираются в отряд и идут захватывать ближайший чужой аванпост. Команда 0 = нейтральный аванпост (никого не спавнит, его можно захватить).
