outpost_war.msg_depleted=[Аванпосты] Аванпост (%s) опустел: выпущено %s NPC
outpost_war.msg_badclass=[Аванпосты] '%s' — не обычный NPC (скорее всего некстбот). Он будет спавниться, но может плохо работать с Outpost War: не ходит в отрядах и по маршрутам.
