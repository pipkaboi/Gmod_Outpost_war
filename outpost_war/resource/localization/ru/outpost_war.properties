outpost_war.mix_clear=Очистить смесь
outpost_war.mix_help=Выберите NPC и оружие выше, задайте долю и нажмите «Добавить». Аванпост будет спавнить их вперемешку по долям (до 8 строк). Двойной клик по строке удаляет её. Пустая смесь — спавнится только NPC, выбранный выше. Смесь сохраняется в пресетах.
